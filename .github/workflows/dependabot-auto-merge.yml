name: Dependabot auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure auto-merge for non-major updates only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Dependabot's version fields may contain digests rather than the Docker tag.
          # Validate the actual PR patch; never execute code from the PR.
          if [[ "$PACKAGE_ECOSYSTEM" == "docker" && "$DEPENDENCY_NAMES" == "node" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate > "$RUNNER_TEMP/pr-files.json"
            if python3 - "$RUNNER_TEMP/pr-files.json" <<'PY'
          import json, re, sys
          files = json.load(open(sys.argv[1]))
          if len(files) != 1 or files[0].get("filename") != "Dockerfile" or files[0].get("status") != "modified":
              sys.exit(1)
          patch = files[0].get("patch", "")
          removed = [line[1:] for line in patch.splitlines() if line.startswith("-") and not line.startswith("---")]
          added = [line[1:] for line in patch.splitlines() if line.startswith("+") and not line.startswith("+++")]
          pattern = re.compile(r"FROM node:24-alpine@sha256:[0-9a-f]{64} AS (tooling|runtime)$")
          normalize = lambda line: re.sub(r"@sha256:[0-9a-f]{64}", "@sha256:DIGEST", line)
          valid = (len(removed) == len(added) == 2
                   and all(pattern.fullmatch(line) for line in removed + added)
                   and sorted(map(normalize, removed)) == sorted(map(normalize, added))
                   and sorted(removed) != sorted(added))
          sys.exit(0 if valid else 1)
          PY
            then
              gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
              exit 0
            fi
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
              ;;
            *)
              # Unknown classifications and Major updates require manual merging.
              if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
                gh pr merge "$PR_URL" --disable-auto
              fi
              ;;
          esac
