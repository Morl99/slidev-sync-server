name: Helm chart
on:
  pull_request:
    paths: ['charts/**', '.github/workflows/helm.yml']
  push:
    branches: [main]
    paths: ['charts/**', '.github/workflows/helm.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/helm.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/helm-bin"
          install "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Lint and render both transports
        run: |
          helm lint --strict charts/slidev-sync-server
          helm template smoke charts/slidev-sync-server > "$RUNNER_TEMP/sse.yaml"
          ! grep -Eq 'runAs(User|Group):' "$RUNNER_TEMP/sse.yaml"
          helm template smoke charts/slidev-sync-server --set podSecurityContext.runAsUser=1000853000 --set podSecurityContext.runAsGroup=1000853000 --set securityContext.runAsNonRoot=true > "$RUNNER_TEMP/custom-security.yaml"
          grep -q 'runAsUser: 1000853000' "$RUNNER_TEMP/custom-security.yaml"
          grep -q 'runAsGroup: 1000853000' "$RUNNER_TEMP/custom-security.yaml"
          helm template smoke charts/slidev-sync-server --set config.websocket=true > "$RUNNER_TEMP/ws.yaml"
          helm template smoke charts/slidev-sync-server --set ingress.enabled=true > "$RUNNER_TEMP/ingress.yaml"
      - name: Package once
        id: package
        run: |
          set -euo pipefail
          version=$(helm show chart charts/slidev-sync-server | awk '$1 == "version:" {gsub(/"/, "", $2); print $2}')
          mkdir -p "$RUNNER_TEMP/chart"
          helm package charts/slidev-sync-server --destination "$RUNNER_TEMP/chart"
          archive="$RUNNER_TEMP/chart/slidev-sync-server-$version.tgz"
          test -f "$archive"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart/*.tgz
          retention-days: 1
  publish:
    needs: chart
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-helm-chart
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # No checkout or execution of repository scripts in this privileged job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart
      - name: Install checksum-pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/helm.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/helm-bin"
          install "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Publish immutable chart version and sign its digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ needs.chart.outputs.version }}
          EXPECTED_CHECKSUM: ${{ needs.chart.outputs.checksum }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/chart/slidev-sync-server-$CHART_VERSION.tgz"
          echo "$EXPECTED_CHECKSUM  $archive" | sha256sum --check
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          ref="$registry/slidev-sync-server"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Cosign uses Docker's credential configuration.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io >/dev/null 2>&1; docker logout ghcr.io >/dev/null 2>&1' EXIT
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/charts%2Fslidev-sync-server")
          exists=false
          if [ "$status" = 200 ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            if helm pull "oci://$ref" --version "$CHART_VERSION" --destination "$RUNNER_TEMP/previous" > "$RUNNER_TEMP/pull.log" 2>&1; then
              exists=true
            elif ! grep -Eqi 'not found|manifest unknown' "$RUNNER_TEMP/pull.log"; then
              cat "$RUNNER_TEMP/pull.log" >&2
              exit 1
            fi
          elif [ "$status" != 404 ]; then
            echo "Cannot inspect chart package: HTTP $status" >&2
            exit 1
          fi
          if [ "$exists" = true ]; then
            # Ignore gzip/tar timestamps; compare paths and hashes of file contents.
            cat > "$RUNNER_TEMP/fingerprint.py" <<'PY'
          import hashlib, json, sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              files = []
              for item in archive.getmembers():
                  if item.isdir():
                      continue
                  if not item.isfile():
                      raise ValueError("Unexpected non-regular chart entry")
                  files.append((item.name, hashlib.sha256(archive.extractfile(item).read()).hexdigest()))
          print(hashlib.sha256(json.dumps(sorted(files), separators=(",", ":")).encode()).hexdigest())
          PY
            current=$(python "$RUNNER_TEMP/fingerprint.py" "$archive")
            previous=$(python "$RUNNER_TEMP/fingerprint.py" "$RUNNER_TEMP/previous/slidev-sync-server-$CHART_VERSION.tgz")
            if [ "$current" != "$previous" ]; then
              echo "Chart version already exists with different contents. Bump Chart.yaml version." >&2
              exit 1
            fi
            cp "$RUNNER_TEMP/pull.log" "$RUNNER_TEMP/registry.log"
            echo "Unchanged chart version; skipping push." >> "$GITHUB_STEP_SUMMARY"
          else
            helm push "$archive" "oci://$registry" 2>&1 | tee "$RUNNER_TEMP/registry.log"
          fi
          digest=$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/registry.log" | head -n1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Re-signing also allows safe recovery after an interrupted first publication.
          cosign sign --yes "$ref@$digest"
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/helm.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref@$digest"
          echo "Chart: oci://$ref --version $CHART_VERSION ($digest)" >> "$GITHUB_STEP_SUMMARY"
