name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      archive: ${{ steps.fingerprint.outputs.archive }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build once without cached package upgrades
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          no-cache: true
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: slidev-sync-server:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          sh test/container-smoke.sh slidev-sync-server:test
      - name: Block high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          cache: false
      - name: Generate SBOM and stable release fingerprint
        id: fingerprint
        env:
          SOURCE_HASH: ${{ hashFiles('src/**', 'Dockerfile', '.dockerignore') }}
        run: |
          trivy image --input "$RUNNER_TEMP/image.tar" --format cyclonedx --output "$RUNNER_TEMP/sbom.json"
          jq --arg source "$SOURCE_HASH" '.metadata.properties = ((.metadata.properties // []) + [{"name":"slidev.sourceHash","value":$source}])' "$RUNNER_TEMP/sbom.json" > "$RUNNER_TEMP/sbom.tmp"
          mv "$RUNNER_TEMP/sbom.tmp" "$RUNNER_TEMP/sbom.json"
          jq -cS '{source: [.metadata.properties[]? | select(.name == "slidev.sourceHash") | .value], packages: [.components[] | {type,name,version,purl,hashes: ((.hashes // []) | sort_by(.alg,.content))}] | sort_by(.purl,.name,.version)}' "$RUNNER_TEMP/sbom.json" > "$RUNNER_TEMP/dependencies.json"
          echo "fingerprint=$(sha256sum "$RUNNER_TEMP/dependencies.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "archive=$(sha256sum "$RUNNER_TEMP/image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-image
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/sbom.json
          retention-days: 1
  publish:
    needs: verify
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-image
          path: ${{ runner.temp }}/verified
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare against signed SBOM of latest
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ARCHIVE: ${{ needs.verify.outputs.archive }}
          FINGERPRINT: ${{ needs.verify.outputs.fingerprint }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified"
          echo "$EXPECTED_ARCHIVE  image.tar" | sha256sum --check
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          changed=true
          # A missing package is the only bootstrap case. Registry/network errors fail closed.
          package_status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}")
          if [ "$package_status" = 200 ]; then
            docker buildx imagetools inspect "$image:latest" >/dev/null
            cosign verify-attestation --type cyclonedx \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image:latest" > "$RUNNER_TEMP/previous.json"
            jq -r '.payload' "$RUNNER_TEMP/previous.json" | head -n1 | base64 -d > "$RUNNER_TEMP/statement.json"
            jq -cS '.predicate | {source: [.metadata.properties[]? | select(.name == "slidev.sourceHash") | .value], packages: [.components[] | {type,name,version,purl,hashes: ((.hashes // []) | sort_by(.alg,.content))}] | sort_by(.purl,.name,.version)}' "$RUNNER_TEMP/statement.json" > "$RUNNER_TEMP/previous-dependencies.json"
            previous=$(sha256sum "$RUNNER_TEMP/previous-dependencies.json" | cut -d' ' -f1)
            if [ "$previous" = "$FINGERPRINT" ]; then changed=false; fi
          elif [ "$package_status" != 404 ]; then
            echo "Cannot inspect GHCR package: HTTP $package_status" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Runtime dependency/source change: $changed" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the exact tested image and sign by digest
        if: steps.release.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/verified/image.tar"
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag slidev-sync-server:test "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$IMAGE@$digest"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/verified/sbom.json" "$IMAGE@$digest"
          # Advance public aliases only after signing succeeds; no rebuild.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$digest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:${GITHUB_REF_NAME}" "$IMAGE@$digest"
          fi
          echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
