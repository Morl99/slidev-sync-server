apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slidev-sync-server.name" . }}
  labels:
    {{- include "slidev-sync-server.extraLabels" (dict "root" . "labels" .Values.deployment.labels) | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "slidev-sync-server.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slidev-sync-server.podLabels" . | nindent 8 }}
      {{- with .Values.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: server
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WS
              value: {{ ternary "true" "" .Values.config.websocket | quote }}
            - name: DEBUG
              value: {{ .Values.config.debug | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.config.corsOrigin | quote }}
          startupProbe:
            tcpSocket:
              port: server
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: server
          livenessProbe:
            tcpSocket:
              port: server
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
