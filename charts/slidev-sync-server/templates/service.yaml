apiVersion: v1
kind: Service
metadata:
  name: {{ include "slidev-sync-server.name" . }}
  labels:
    {{- include "slidev-sync-server.extraLabels" (dict "root" . "labels" .Values.serviceMetadata.labels) | nindent 4 }}
  {{- with .Values.serviceMetadata.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: server
      port: {{ .Values.service.port }}
      targetPort: server
  selector:
    {{- include "slidev-sync-server.selector" . | nindent 4 }}
